# Copy these into your ESPHome secrets.yaml (ESPHome Builder > top-right menu > Secrets)
# and replace the values with your own.

wifi_ssid: "YourWiFiName"
wifi_password: "YourWiFiPassword"

# 32-byte base64 key. ESPHome Builder creates one for you when you add a new device,
# or see https://esphome.io/components/api/#configuration-variables
api_encryption_key: "REPLACE_WITH_YOUR_OWN_KEY"

# Password for the fallback Wi-Fi hotspot the ESP32 starts if it loses your network
fallback_ap_password: "ChooseAStrongPassword"
